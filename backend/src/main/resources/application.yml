spring:
  application:
    name: peak-kinetics
  docker:
    compose:
      enabled: false
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 128MB
      max-request-size: 130MB

uploadthing:
  token: ${UPLOADTHING_TOKEN}

google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID}
    client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
    refresh-token: ${GOOGLE_OAUTH_REFRESH_TOKEN}
  business:
    account-ref: ${GOOGLE_BUSINESS_ACCOUNT}
    location-ref: ${GOOGLE_BUSINESS_LOCATION}
  places:
    api-key: ${GOOGLE_PLACES_API_KEY}
    place-id: ${GOOGLE_PLACES_PLACE_ID}

resend:
  api:
    key: ${RESEND_API_KEY}

vonage:
  api-key: ${VONAGE_API_KEY}
  api-secret: ${VONAGE_API_SECRET}
  from-number: ${VONAGE_FROM_NUMBER}

server:
  forward-headers-strategy: framework
  shutdown: immediate

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

management:
  tracing:
    sampling:
      probability: 0.1

storage:
  upload-dir: uploads

logging:
  level:
    root: INFO
