spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # Hibernate prefixes all generated SQL with this schema name. Aiven's
        # `public` schema is restricted (DROP SCHEMA public not permitted), so
        # we use a dedicated `peakkinetics` schema.
        default_schema: peakkinetics
  flyway:
    enabled: true
    # Greenfield deploy: V1 creates all tables, V2 adds audit_log, V3 drops legacy.
    # If/when migrating an existing DB (pg_dump→pg_restore into Aiven), set:
    #   baseline-on-migrate: true
    #   baseline-version: 1
    # so Flyway stamps V1 as already-applied instead of trying to recreate tables.
    baseline-on-migrate: false
    # All migrations run against (and flyway_schema_history lives in) this schema.
    # Schema must already exist (Aiven blocks CREATE SCHEMA from the app role
    # in some configurations); create it once via Aiven Query Editor:
    #   CREATE SCHEMA peakkinetics AUTHORIZATION avnadmin;
    schemas: peakkinetics
    default-schema: peakkinetics
    create-schemas: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

resend:
  api-key: ${RESEND_API_KEY}
  from-address: ${RESEND_FROM_ADDRESS:PEAK KINETICS PT <noReply@peakkineticspt.net>}
  reply-to: ${RESEND_REPLY_TO:info@peakkineticspt.com}

server:
  forward-headers-strategy: framework
  shutdown: graceful
  servlet:
    session:
      timeout: 15m
      cookie:
        http-only: true
        secure: true
        same-site: strict

spring.lifecycle.timeout-per-shutdown-phase: 30s

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

management:
  tracing:
    sampling:
      probability: 0.1
    export:
      otlp:
        enabled: ${GRAFANA_OTLP_ENABLED:false}
  logging:
    export:
      otlp:
        enabled: ${GRAFANA_OTLP_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  # OTLP exporters point at Grafana Cloud. Disabled by default so deploys
  # without the secrets set continue to work; flip GRAFANA_OTLP_ENABLED=true
  # in fly secrets once GRAFANA_OTLP_ENDPOINT and GRAFANA_OTLP_AUTH are set.
  # Metrics still use the Micrometer-based `management.otlp.metrics.*` keys;
  # tracing + logs moved to `management.opentelemetry.*` in Spring Boot 4.
  otlp:
    metrics:
      export:
        enabled: ${GRAFANA_OTLP_ENABLED:false}
        url: ${GRAFANA_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        headers:
          Authorization: ${GRAFANA_OTLP_AUTH}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${GRAFANA_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
          headers:
            Authorization: ${GRAFANA_OTLP_AUTH}
    logging:
      export:
        otlp:
          endpoint: ${GRAFANA_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
          headers:
            Authorization: ${GRAFANA_OTLP_AUTH}

storage:
  upload-dir: ${STORAGE_UPLOAD_DIR:/app/uploads}

r2:
  endpoint: ${R2_ENDPOINT:}
  access-key-id: ${R2_ACCESS_KEY_ID:}
  secret-access-key: ${R2_SECRET_ACCESS_KEY:}
  bucket: ${R2_BUCKET:}
  public-base-url: ${R2_PUBLIC_BASE_URL:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://peakkineticspt.com,https://www.peakkineticspt.com}
  allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:https://*.peakkineticspt.com,https://*.pages.dev}

cloudflare:
  access:
    team-domain: ${CLOUDFLARE_ACCESS_TEAM_DOMAIN}
    audience: ${CLOUDFLARE_ACCESS_AUDIENCE}
  turnstile:
    secret-key: ${CLOUDFLARE_TURNSTILE_SECRET}

logging:
  level:
    root: INFO
    com.peakkineticspt: INFO
