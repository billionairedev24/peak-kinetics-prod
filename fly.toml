# Fly.io app for Peak Kinetics backend (PHI path).
# Region iad = US East, same region as Aiven Postgres to minimize latency.
# Machine auto-stop is DISABLED so the JVM stays warm (no 5–8s cold starts for patients).

app = "peak-kinetics-api"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "backend/Dockerfile"
  # build the Dockerfile from the repo root so backend/ and frontend/ paths resolve
  build-target = ""

[deploy]
  # Flyway runs on app startup; no release_command needed.
  # (The Dockerfile uses ENTRYPOINT ["java","-jar","app.jar"], which appends
  # any release_command as ignored args, so the release machine never exits.)
  strategy = "rolling"

[env]
  SPRING_PROFILES_ACTIVE = "prod"
  STORAGE_UPLOAD_DIR = "/app/uploads"
  JAVA_TOOL_OPTIONS = "-XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 150

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "90s"
    method = "GET"
    path = "/actuator/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048

[[mounts]]
  source = "peak_uploads"
  destination = "/app/uploads"
