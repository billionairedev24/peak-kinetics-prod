name: Build and Deploy to GCP

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  INSTANCE_NAME: peak-kinetics-vm
  INSTANCE_ZONE: us-central1-a

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Build with Maven (includes frontend)
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: |
            backend/target/*.jar
            compose.yml
            backend/logback-spring.xml
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: deployment-package

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_VM_SSH_KEY }}" > ~/.ssh/gcp_key
          chmod 600 ~/.ssh/gcp_key
          ssh-keyscan -H ${{ secretsINSTANCE_IP }} >> ~/.ssh/known_hosts

      - name: Copy files to VM
        run: |
          # Create deployment directory structure
          ssh -i ~/.ssh/gcp_key -o StrictHostKeyChecking=no ${{ secrets.GCP_VM_USER }}@${{ secretsINSTANCE_IP }} '
            mkdir -p ~/deployment/backend/target
            mkdir -p ~/deployment/uploads/blog/images
          '
          
          # Copy JAR file
          scp -i ~/.ssh/gcp_key backend/target/*.jar ${{ secrets.GCP_VM_USER }}@${{ secretsINSTANCE_IP }}:~/deployment/backend/target/
          
          # Copy Docker Compose file
          scp -i ~/.ssh/gcp_key compose.yml ${{ secrets.GCP_VM_USER }}@${{ secretsINSTANCE_IP }}:~/deployment/
          
          # Copy logback config if needed
          scp -i ~/.ssh/gcp_key backend/logback-spring.xml ${{ secrets.GCP_VM_USER }}@${{ secretsINSTANCE_IP }}:~/deployment/backend/

      - name: Deploy application
        run: |
          ssh -i ~/.ssh/gcp_key ${{ secrets.GCP_VM_USER }}@${{ secretsINSTANCE_IP }} << 'ENDSSH'
            set -e
            cd ~/deployment
          
            # Stop existing application gracefully
            if pgrep -f "peak-backend.jar" > /dev/null; then
              echo "Stopping existing Spring Boot application..."
              pkill -TERM -f "peak-backend.jar" || true
              sleep 5
              # Force kill if still running
              pkill -KILL -f "peak-backend.jar" || true
            fi
          
            # Start/restart Docker Compose for LGTM stack
            echo "Starting LGTM stack with Docker Compose..."
            docker compose down || true
            docker compose up -d
          
            # Wait for observability stack to be ready
            echo "Waiting for observability stack..."
            sleep 10
          
            # Start Spring Boot application in background
            echo "Starting Spring Boot application..."
            cd backend/target
          
            # Find the JAR file
            JAR_FILE=$(ls *.jar | head -n 1)
          
            # Start application with nohup
            nohup java -jar "$JAR_FILE" > ~/deployment/app.log 2>&1 &
          
            # Save PID
            echo $! > ~/deployment/app.pid
          
            echo "Application started with PID: $(cat ~/deployment/app.pid)"
          ENDSSH

      - name: Health check
        run: |
          echo "Waiting for application to start..."
          sleep 30
          
          # Health check with retries
          for i in {1..10}; do
            if curl -f http://${{ secretsINSTANCE_IP }}:8080/actuator/health; then
              echo "✅ Deployment successful! Application is healthy."
              echo "🌐 Application URL: http://${{ secretsINSTANCE_IP }}:8080"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10 seconds..."
            sleep 10
          done
          
          echo "❌ Health check failed after 10 attempts"
          
          # Fetch logs for debugging
          ssh -i ~/.ssh/gcp_key ${{ secrets.GCP_VM_USER }}@${{ secretsINSTANCE_IP }} '
            echo "=== Application Logs ==="
            tail -n 50 ~/deployment/app.log
            echo "=== Docker Compose Status ==="
            cd ~/deployment && docker compose ps
          '
          exit 1

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/gcp_key