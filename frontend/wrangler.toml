# Cloudflare Workers + Static Assets config for the Next.js frontend.
# Built via `pnpm run pages:build` (next-on-pages), which writes:
#   .vercel/output/static/_worker.js/index.js   ← runtime Worker (dynamic routes)
#   .vercel/output/static/                       ← static files (served by [assets])
# Deployed via `wrangler deploy` from the Cloudflare dashboard's git integration.
name = "peak-kinetics-prod"
main = ".vercel/output/static/_worker.js/index.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".vercel/output/static"
binding = "ASSETS"

# Environment variables for production builds.
# NEXT_PUBLIC_* values must be set at build time, not at runtime — define them
# either here, in the Cloudflare dashboard (Settings → Environment Variables),
# or via `wrangler deploy --var KEY=VAL`.
[vars]
NEXT_PUBLIC_API_URL = "https://api.peakkineticspt.com"
# NEXT_PUBLIC_TURNSTILE_SITE_KEY is set in dashboard (per-environment).
